# Publica sulotec.com cada vez que se sube un cambio del portal a la rama main.
# Corre en el runner propio instalado en el servidor Oracle (vm/scripts/instalar-runner.sh):
# no se abren puertos y GitHub no guarda llaves del servidor.
name: Publicar portal

on:
  push:
    branches: [main]
    paths:
      - 'apps/portal/**'
      - '.github/workflows/portal.yml'
  workflow_dispatch:

concurrency:
  group: portal
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: [self-hosted, sulotec]
    steps:
      - uses: actions/checkout@v4

      # Cuentas (cuenta.sulotec.com), en GitHub > Settings > Secrets and variables > Actions > Variables;
      # despues de cambiarlas se vuelve a correr este workflow:
      #   CUENTA_ACTIVA=false   apaga "Iniciar sesion" en todo el portal (emergencias). Por defecto: encendido.
      #   CUENTA_REGISTRO=true  muestra "Crear cuenta" (cuando cuenta.sulotec.com ya tenga correo de salida).
      - name: Compilar el sitio (Node en Docker)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e PUBLIC_CUENTA_ACTIVA="${{ vars.CUENTA_ACTIVA || 'true' }}" \
            -e PUBLIC_CUENTA_REGISTRO="${{ vars.CUENTA_REGISTRO || 'false' }}" \
            -v "$PWD/apps/portal:/app" -w /app node:24-alpine \
            sh -c "npm ci --no-audit --no-fund && npm run build"

      - name: Publicar en /data/apps/portal
        run: |
          set -e
          mkdir -p /data/apps/portal/sitio
          rsync -a --delete apps/portal/dist/ /data/apps/portal/sitio/
          cp apps/portal/deploy/docker-compose.yml apps/portal/deploy/nginx.conf /data/apps/portal/
          cd /data/apps/portal
          docker compose up -d
          docker exec portal nginx -t
          docker exec portal nginx -s reload

      - name: Comprobar que responde
        run: docker exec portal wget -qS -O /dev/null http://127.0.0.1/ 2>&1 | head -1
