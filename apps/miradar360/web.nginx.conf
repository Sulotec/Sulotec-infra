# Nota: en nginx, si un "location" define add_header, deja de heredar los del bloque "server".
# Por eso los encabezados de seguridad se repiten en cada location.
# Sin Content-Security-Policy estricta a proposito: el panel carga mapas y habla con la API.
# Se agrega despues del ensayo, midiendo que no rompa nada.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Archivos con huella en el nombre: se pueden guardar mucho tiempo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    try_files $uri =404;
  }

  # Aplicacion de una sola pagina: cualquier ruta devuelve index.html.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    try_files $uri $uri/ /index.html;
  }
}
