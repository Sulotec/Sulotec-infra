# Copia al servidor la OPERACION del Buscador Interno (compose, configuracion y publicador automatico).
# El codigo del Buscador vive en Sulotec/buscador-interno; el servidor lo publica solo con
# apps/buscador/deploy/actualizar.sh (ver apps/buscador/README.md).
name: Publicar buscador (operacion)

on:
  push:
    branches: [main]
    paths:
      - 'apps/buscador/**'
      - '.github/workflows/buscador.yml'
  workflow_dispatch:

concurrency:
  group: buscador
  cancel-in-progress: false

jobs:
  copiar:
    runs-on: [self-hosted, sulotec]
    steps:
      - uses: actions/checkout@v4

      - name: Copiar a /data/apps/buscador
        run: |
          mkdir -p /data/apps/buscador
          cp apps/buscador/deploy/docker-compose.yml apps/buscador/deploy/preparar.sh \
             apps/buscador/deploy/actualizar.sh apps/buscador/deploy/instalar-actualizador.sh /data/apps/buscador/
          echo "Operacion del Buscador copiada."
