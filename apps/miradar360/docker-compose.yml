# MiRadar360 (web + API + base de datos) en el servidor Oracle. En el servidor vive en /data/apps/miradar360.
# Cloudflare Tunnel (Public Hostname):
#   miradar360.sulotec.com      -> http://miradar360-web:80
#   api-miradar360.sulotec.com  -> http://miradar360-api:4000
# Configuracion y secretos (no estan en el repositorio): /opt/sulotec/miradar360.env, lo crea scripts/preparar.sh.
# Se levanta con scripts/desplegar.sh (usa: docker compose --env-file /opt/sulotec/miradar360.env up -d).
name: miradar360

services:
  db:
    image: postgres:18
    container_name: miradar360-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_DB: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en /opt/sulotec/miradar360.env}
    volumes:
      - /data/miradar360/postgres:/var/lib/postgresql   # PostgreSQL 18: el volumen va en /var/lib/postgresql
    networks: [interna]                                  # sin puertos publicados; solo la API llega a la base
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: miradar360-api:latest
    container_name: miradar360-api
    restart: unless-stopped
    init: true                                           # evita procesos huerfanos de Chromium (PDFs)
    depends_on:
      db:
        condition: service_healthy
    env_file: /opt/sulotec/miradar360.env
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [edge, interna]
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s                                  # al arrancar corre las migraciones

  web:
    image: miradar360-web:latest
    container_name: miradar360-web
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    volumes:
      - ./web.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt: ["no-new-privileges:true"]
    networks: [edge]
    mem_limit: 64m

networks:
  edge:
    external: true
    name: sulotec_edge
  interna:
    internal: true
