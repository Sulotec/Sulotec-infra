# Portal sulotec.com: nginx sirviendo el sitio estatico generado por Astro (carpeta ./sitio).
# En el servidor vive en /data/apps/portal. Cloudflare Tunnel: sulotec.com y www.sulotec.com -> http://portal:80
name: portal

services:
  portal:
    image: nginx:stable-alpine
    container_name: portal
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    volumes:
      - ./sitio:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
    mem_limit: 64m

networks:
  edge:
    external: true
    name: sulotec_edge
