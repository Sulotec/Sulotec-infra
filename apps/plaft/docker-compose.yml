# PLAFT (Prevención de Lavado de Activos, repos Security-*): API, web y, opcional, el servicio de IA. En el servidor vive en /data/apps/plaft.
# Cloudflare Tunnel (Public hostname):
#   plaft.sulotec.com      -> http://plaft-web:3000
#   api-plaft.sulotec.com  -> http://plaft-api:8081
# Configuración y secretos (nunca en el repositorio): /opt/sulotec/plaft.env, lo crea deploy/preparar.sh.
# La base es la MySQL compartida de la VM (red sulotec_data); no publica puertos.
# La llave de Oracle Object Storage (svc-plaft) está en /opt/sulotec/plaft-oci y entra solo a plaft-api, en modo lectura.
# El servicio de IA (ml) es opcional: solo se levanta con el perfil "ml" (desplegar.sh lo activa si existe /opt/sulotec/plaft-ml.env).
# No tiene ruta en Cloudflare ni puertos publicados: solo plaft-api lo llama, con la clave interna, por la red sulotec_data.
# Indira y la deteccion de casos en prensa usan un modelo de lenguaje local (Ollama, perfil "ia"): corre en este servidor, ningun dato sale a terceros.
# Ollama solo comparte la red "ia" con plaft-ml (ninguna otra aplicacion puede usarlo). Se instala con deploy/activar-indira.sh.
name: plaft

services:
  api:
    image: plaft-api:latest
    container_name: plaft-api
    restart: unless-stopped
    env_file: /opt/sulotec/plaft.env
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [edge, data]
    mem_limit: 1g
    volumes:
      - /opt/sulotec/plaft-oci/config:/run/oci/config:ro
      - /opt/sulotec/plaft-oci/key.pem:/run/oci/key.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  ml:
    profiles: ["ml"]
    image: plaft-ml:latest
    container_name: plaft-ml
    restart: unless-stopped
    env_file: /opt/sulotec/plaft-ml.env
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [data, ia]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  ollama:
    profiles: ["ia"]
    image: ollama/ollama:0.40.2
    container_name: plaft-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - /data/apps/plaft/ollama:/root/.ollama
    read_only: true
    tmpfs: ["/tmp:exec,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [ia]
    mem_limit: 9g
    memswap_limit: 9g
    cpu_shares: 256
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s

  web:
    image: plaft-web:latest
    container_name: plaft-web
    restart: unless-stopped
    user: node
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000,mode=0755
      - /home/node:uid=1000,gid=1000,mode=0755
    security_opt: ["no-new-privileges:true"]
    networks: [edge]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  edge:
    external: true
    name: sulotec_edge
  data:
    external: true
    name: sulotec_data
  ia: {}
